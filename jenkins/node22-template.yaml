# Node 22 pod template

apiVersion: v1
kind: Pod
spec:
  containers:
    - name: node
      image: node:22-alpine
      command:
        - sleep
      args:
        - 99d

    - name: docker
      image: docker:27-cli
      command:
        - sleep
      args:
        - 99d
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock

    - name: git
      image: alpine/git:v2.54.0
      command:
        - sleep
      args:
        - 99d

  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock